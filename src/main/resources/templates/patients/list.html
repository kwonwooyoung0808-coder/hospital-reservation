<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('환자 관리')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('patients')}"></nav>
<main class="container page-content">
    <div class="page-header"><div><span class="eyebrow">PATIENTS</span><h1>환자 관리</h1><p>환자 정보를 등록하고 조회합니다.</p></div><a class="btn btn-primary" th:href="@{/patients/new}">+ 환자 등록</a></div>
    <form class="filter-bar" method="get" th:action="@{/patients}">
        <div class="filter-field"><label for="name">이름</label><input id="name" class="form-control" name="name" th:value="${name}" placeholder="환자명 검색"></div>
        <div class="filter-field"><label for="phone">전화번호</label><input id="phone" class="form-control" name="phone" th:value="${phone}" placeholder="전화번호 검색"></div>
        <button class="btn btn-primary" type="submit">검색</button><a class="btn btn-secondary" th:href="@{/patients}">초기화</a>
    </form>
    <section class="panel table-panel"><div class="table-responsive"><table>
        <thead><tr><th>ID</th><th>이름</th><th>생년월일</th><th>전화번호</th><th>관리</th></tr></thead><tbody>
        <tr th:each="patient : ${patients}"><td th:text="${patient.id}"></td><td class="strong" th:text="${patient.name}"></td><td th:text="${patient.birthDate ?: '-'}"></td><td th:text="${patient.phone}"></td><td class="actions"><a class="btn btn-small btn-secondary" th:href="@{/patients/{id}/edit(id=${patient.id})}">수정</a><form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post" onsubmit="return confirm('이 환자를 삭제하시겠습니까?');"><button class="btn btn-small btn-danger" type="submit">삭제</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(patients)}"><td class="empty-state" colspan="5">등록된 데이터가 없습니다.</td></tr>
        </tbody></table></div></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
