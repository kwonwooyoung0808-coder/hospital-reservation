<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${doctor.id == null ? '의사 등록' : '의사 수정'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('doctors')}"></nav>
<main class="container page-content narrow">
    <div class="page-header"><div><span class="eyebrow">DOCTOR</span><h1 th:text="${doctor.id == null ? '의사 등록' : '의사 정보 수정'}"></h1></div><a class="btn btn-secondary" th:href="@{/doctors}">목록으로</a></div>
    <section class="panel"><form th:object="${doctor}" th:action="${doctor.id == null} ? @{/doctors} : @{/doctors/{id}(id=${doctor.id})}" method="post">
        <div class="form-group"><label for="name">이름 <span class="required">*</span></label><input id="name" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:field="*{name}" placeholder="의사 이름"><p class="field-error" th:errors="*{name}"></p></div>
        <div class="form-group"><label for="department">진료과 <span class="required">*</span></label><select id="department" class="form-control" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" th:field="*{department}"><option value="">진료과 선택</option><option th:each="item : ${departments}" th:value="${item}" th:text="${item}"></option></select><p class="field-error" th:errors="*{department}"></p></div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">저장</button><a class="btn btn-secondary" th:href="@{/doctors}">취소</a></div>
    </form></section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
