<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>진료 예약</title>
</head>

<body>

<h1>진료 예약</h1>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"
   style="color:red;">
</p>

<form th:action="@{/reservations}" method="post">

    <div>
        <label>환자</label>

        <select name="patientId" required>
            <option value="">환자 선택</option>

            <option
                    th:each="patient : ${patients}"
                    th:value="${patient.id}"
                    th:text="${patient.name}">
            </option>
        </select>
    </div>

    <br>

    <div>
        <label>의사</label>

        <select name="doctorId" required>
            <option value="">의사 선택</option>

            <option
                    th:each="doctor : ${doctors}"
                    th:value="${doctor.id}"
                    th:text="${doctor.name + ' - ' + doctor.department}">
            </option>
        </select>
    </div>

    <br>

    <div>
        <label>예약 시간</label>

        <input type="datetime-local"
               name="reservationDateTime"
               required>
    </div>

    <br>

    <button type="submit">
        예약하기
    </button>

</form>

<br>

<a th:href="@{/reservations}">
    예약 목록
</a>

</body>
</html>
